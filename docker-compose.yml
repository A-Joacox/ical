services:
  app:
    build: .
    restart: unless-stopped
    env_file: apps/server/.env
    environment:
      DATA_DIR: /data
      GLANCES_URL: http://glances:61208
    volumes:
      - ./data:/data
    # Solo escucha en localhost: `tailscale funnel` lo publica con HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - glances

  # Métricas del host (CPU, RAM, discos, temperaturas, batería, contenedores). Solo la API REST,
  # sin puertos publicados: únicamente la app la consulta por la red interna de Docker.
  glances:
    # Variante Ubuntu (glibc): la librería NVML que inyecta el toolkit de NVIDIA no carga en Alpine.
    image: nicolargo/glances:ubuntu-latest-full
    restart: unless-stopped
    pid: host
    # Comparte el hostname del host (si no, muestra el ID del contenedor).
    uts: host
    environment:
      GLANCES_OPT: "-w --disable-webui"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    # GPU NVIDIA (temperatura y uso): requiere que `docker run --rm --gpus all ubuntu nvidia-smi`
    # funcione en el host. Pendiente: hoy falla con el error de nvidia-cuda-mps-control.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, utility]
